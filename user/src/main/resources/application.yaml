server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: user

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/biolibrary
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false

  sql:
    init:
      mode: always
      continue-on-error: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:users}
        format_sql: true
        jdbc:
          time_zone: UTC
        hbm2ddl:
          create_namespaces: true

jwt:
  secret: ${JWT_SECRET:586B633A7A4B3F4428472B4B6250655368566D597133743677397A2443264629}
  expiration: ${JWT_EXPIRATION:3600000}

university:
  mock:
    url: ${UNIVERSITY_MOCK_URL:http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs