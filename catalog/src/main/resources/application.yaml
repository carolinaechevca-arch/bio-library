server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: catalog

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/biolibrary}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces
