global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8090']

  - job_name: user
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user:8080']

  - job_name: catalog
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['catalog:8082']

  - job_name: loans
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['loans:8083']

  - job_name: notification
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification:8084']

  - job_name: university-mock
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['university-mock:8081']
